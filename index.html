<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#9fd7f5" />
    <title>ND — City Prototype</title>
  </head>
  <body>
    <div id="app"></div>

    <aside id="hud" class="hud" aria-live="polite">
      <div class="hud__brand">ND / CITY</div>
      <div id="objective" class="hud__objective">Načítám…</div>
      <div id="speed" class="hud__speed">0 km/h · 0 bodů</div>
      <div class="hud__hint">WASD / šipky · Shift = běh · dotykové ovládání</div>
    </aside>

    <div class="controls" aria-label="Ovládání vozidla">
      <div class="controls__cluster">
        <button class="control" data-control="left" aria-label="Doleva">←</button>
        <button class="control" data-control="right" aria-label="Doprava">→</button>
      </div>
      <div class="controls__cluster">
        <button class="control" data-control="reverse" aria-label="Jít dozadu">↓</button>
        <button class="control" data-control="accelerate" aria-label="Jít vpřed">↑</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
